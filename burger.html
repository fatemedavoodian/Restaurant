<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="burger.css">
    <title>Document</title>
</head>
<body>
    <section class="card">
        <div class="top">
        <div class="brand">FastFood</div>
        <div class="menu-container">
         <div class="menu" aria-hidden="true"><span></span></div>
         </div>
        </div>
        <div class="inner">
            <!---left colum-->
            <section class="copy">
            <div class="accent" aria-hidden="true"></div>
            <div class="eyebrow">AMAZING</div>
            <h1>BURGER</h1>
            <div class="sub">AT LOW PRICE</div>
            <p class="lead">Get the best of your take <br>away food with a low budget.</p>
            <div class="actions">
            <button class=" button primary">viewmenu</button>
            <button class=" button secondary">book a table</button>
            </div>
        <div class="schedule">
        <div class="hour-section">
        <h2>Breakfast</h2>
        <span>8 AM to 11 AM</span>
     </div>
      <div class="hour-section">
        <h2>Lunch</h2>
        <span>12 PM to 2 PM</span>
     </div>
      <div class="hour-section">
        <h2>Dinner</h2>
        <span>6 PM to 10 PM</span>
       </div>
      </div>
            </section>
            <!--right colum-->
            <section class=""></section>
        </div>
    </section>
    
</body>
</html>
